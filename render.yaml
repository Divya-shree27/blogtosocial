services:
  - type: web
    name: ai-blog-to-social
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: OPENAI_API_KEY
        sync: false  # Set this manually in Render dashboard
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true